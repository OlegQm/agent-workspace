name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: open-agent-workspace-ai-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_GIT_REMOTE: origin
      DEPLOY_REPO_URL: ${{ format('{0}/{1}.git', github.server_url, github.repository) }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_SSH_KEY_PATH: ${{ github.workspace }}/.deploy/deploy_key
      DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ github.workspace }}/.deploy/known_hosts
      DEPLOY_TOKEN_PATH: ${{ github.workspace }}/.deploy/deploy_token
      DEPLOY_ENV_PATH: ${{ github.workspace }}/.deploy/production.env
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute immutable image names
        id: images
        run: |
          set -euo pipefail
          repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_SHA}"
          {
            echo "backend=ghcr.io/${repo}/backend:${tag}"
            echo "frontend=ghcr.io/${repo}/frontend:${tag}"
            echo "tool_gateway=ghcr.io/${repo}/tool-gateway:${tag}"
            echo "code_sync=ghcr.io/${repo}/code-sync:${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR for image publication
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: service/backend
          file: service/backend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: service/frontend
          file: service/frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push Tool Gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: service/tool-gateway
          file: service/tool-gateway/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.tool_gateway }}
          cache-from: type=gha,scope=tool-gateway
          cache-to: type=gha,mode=max,scope=tool-gateway

      - name: Build and push code-sync
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: service/code-sync
          file: service/code-sync/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.code_sync }}
          cache-from: type=gha,scope=code-sync
          cache-to: type=gha,mode=max,scope=code-sync

      - name: Prepare strict SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh "$(dirname "${DEPLOY_SSH_KEY_PATH}")"
          if [ -n "${DEPLOY_SSH_PRIVATE_KEY_B64}" ]; then
            printf '%s' "${DEPLOY_SSH_PRIVATE_KEY_B64}" | base64 -d > "${DEPLOY_SSH_KEY_PATH}"
          elif [ -n "${DEPLOY_SSH_PRIVATE_KEY}" ]; then
            printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" | sed 's/\r$//' > "${DEPLOY_SSH_KEY_PATH}"
          else
            echo "DEPLOY_SSH_PRIVATE_KEY or DEPLOY_SSH_PRIVATE_KEY_B64 is required" >&2
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]; then
            echo "DEPLOY_SSH_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${DEPLOY_SSH_KNOWN_HOSTS_PATH}"
          chmod 600 "${DEPLOY_SSH_KEY_PATH}" "${DEPLOY_SSH_KNOWN_HOSTS_PATH}"
          ssh-keygen -y -f "${DEPLOY_SSH_KEY_PATH}" >/dev/null

      - name: Create protected deployment payloads
        env:
          DEPLOY_GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN || github.token }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HERMES_API_KEY_ASSISTANT: ${{ secrets.HERMES_API_KEY_ASSISTANT }}
          TOOL_GATEWAY_TOKEN_ASSISTANT: ${{ secrets.TOOL_GATEWAY_TOKEN_ASSISTANT }}
          METABASE_PLANNING_METABASE_LINKS_ENABLED: ${{ secrets.METABASE_PLANNING_METABASE_LINKS_ENABLED }}
          METABASE_PUBLIC_URL: ${{ secrets.METABASE_PUBLIC_URL }}
          METABASE_PLANNING_YOUTRACK_ENABLED: ${{ secrets.METABASE_PLANNING_YOUTRACK_ENABLED }}
          YOUTRACK_BASE_URL: ${{ secrets.YOUTRACK_BASE_URL }}
          YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
          YOUTRACK_PROJECT_ID: ${{ secrets.YOUTRACK_PROJECT_ID }}
          YOUTRACK_ASSIGNEE_ID: ${{ secrets.YOUTRACK_ASSIGNEE_ID }}
          YOUTRACK_ASSIGNEE_FIELD_ID: ${{ secrets.YOUTRACK_ASSIGNEE_FIELD_ID }}
          ASSISTANT_SOURCES_YAML_B64: ${{ secrets.ASSISTANT_SOURCES_YAML_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          CODE_SYNC_GITHUB_TOKEN_B64: ${{ secrets.CODE_SYNC_GITHUB_TOKEN_B64 }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          TOOL_GATEWAY_IMAGE: ${{ steps.images.outputs.tool_gateway }}
          CODE_SYNC_IMAGE: ${{ steps.images.outputs.code_sync }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_GITHUB_TOKEN}" ]; then
            echo "DEPLOY_GITHUB_TOKEN is required" >&2
            exit 1
          fi
          printf '%s' "${DEPLOY_GITHUB_TOKEN}" > "${DEPLOY_TOKEN_PATH}"
          chmod 600 "${DEPLOY_TOKEN_PATH}"
          python3 .github/workflows/deploy_scripts/services/create_runtime_env.py "${DEPLOY_ENV_PATH}"

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME || github.actor }}
        run: bash .github/workflows/deploy_scripts/services/deploy_prod_via_ssh.sh

      - name: Remove local secret payloads
        if: always()
        run: rm -f "${DEPLOY_SSH_KEY_PATH}" "${DEPLOY_SSH_KNOWN_HOSTS_PATH}" "${DEPLOY_TOKEN_PATH}" "${DEPLOY_ENV_PATH}"
