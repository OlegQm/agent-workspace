# Example structure only. Keep populated credentials outside this repository
# and restrict each integration to the minimum required scope.
metabase:
  default:
    url: https://metabase.example.invalid
    api_key: replace-with-metabase-api-key
google_ads:
  default:
    developer_token: replace-with-developer-token
    client_id: replace-with-oauth-client-id
    client_secret: replace-with-oauth-client-secret
    refresh_token: replace-with-oauth-refresh-token
    login_customer_id: replace-with-authorized-customer-id
meta_ads:
  default:
    access_token: replace-with-scoped-access-token
    graph_api_version: v23.0
google_analytics:
  default:
    client_id: replace-with-oauth-client-id
    client_secret: replace-with-oauth-client-secret
    refresh_token: replace-with-oauth-refresh-token
superfaktura:
  example:
    api_url: https://api.example.invalid
    email: service-account@example.invalid
    api_key: replace-with-api-key
    company_id: replace-with-company-id
gopay:
  example:
    api_url: https://payments.example.invalid/api
    client_id: replace-with-client-id
    client_secret: replace-with-client-secret
stripe:
  example:
    restricted_key: rk_test_replace-with-restricted-key
    stripe_account: null
clickup:
  example-workspace:
    token: replace-with-scoped-token
