[project]
name = "open-agent-workspace-tool-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "google-ads>=28.0",
  "google-analytics-admin>=0.26",
  "google-analytics-data>=0.18",
  "google-cloud-bigquery>=3.35",
  "httpx>=0.28",
  "mcp>=1.17,<2",
  "pydantic-settings>=2.10",
  "pyyaml>=6.0",
  "sqlglot>=27.7",
  "uvicorn>=0.35"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "import-linter>=2.3",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-protobuf",
  "types-pyyaml",
]

[[tool.mypy.overrides]]
module = ["google.ads.*"]
ignore_missing_imports = true

[project.scripts]
open-agent-workspace-tool-gateway = "tool_gateway.entrypoints.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_gateway"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source = ["tool_gateway"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
