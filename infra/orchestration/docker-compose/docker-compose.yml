name: open-agent-workspace-ai-workspace

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../../../service/backend
    env_file:
      - ../../../config/llm.env
    restart: unless-stopped
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_REFRESH_INTERVAL_SECONDS: ${SESSION_REFRESH_INTERVAL_SECONDS:-300}
      AGENT_CONFIG_DIR: ${AGENT_CONFIG_DIR:-/app/config/agents}
      AGENT_DATA_DIR: ${AGENT_DATA_DIR:-/app/data/agents}
      PREVIEW_CACHE_DIR: ${PREVIEW_CACHE_DIR:-/app/data/agents/.preview-cache}
      PREVIEW_CACHE_MAX_BYTES: ${PREVIEW_CACHE_MAX_BYTES:-2147483648}
      PREVIEW_CACHE_MAX_AGE_SECONDS: ${PREVIEW_CACHE_MAX_AGE_SECONDS:-604800}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-262144000}
      MAX_WORKSPACE_BYTES: ${MAX_WORKSPACE_BYTES:-10737418240}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      METABASE_PLANNING_METABASE_LINKS_ENABLED: ${METABASE_PLANNING_METABASE_LINKS_ENABLED:-false}
      METABASE_PUBLIC_URL: ${METABASE_PUBLIC_URL:-}
      METABASE_PLANNING_YOUTRACK_ENABLED: ${METABASE_PLANNING_YOUTRACK_ENABLED:-false}
      YOUTRACK_BASE_URL: ${YOUTRACK_BASE_URL:-}
      YOUTRACK_TOKEN: ${YOUTRACK_TOKEN:-}
      YOUTRACK_PROJECT_ID: ${YOUTRACK_PROJECT_ID:-}
      YOUTRACK_ASSIGNEE_ID: ${YOUTRACK_ASSIGNEE_ID:-}
      YOUTRACK_ASSIGNEE_FIELD_ID: ${YOUTRACK_ASSIGNEE_FIELD_ID:-}
      HERMES_API_KEY_ASSISTANT: ${HERMES_API_KEY_ASSISTANT}
    volumes:
      - ../../../config/agents:/app/config/agents:ro
      - ../../../data/agents:/app/data/agents
    depends_on:
      postgres:
        condition: service_healthy

  tool-gateway-assistant:
    build:
      context: ../../../service/tool-gateway
    restart: unless-stopped
    network_mode: host
    dns:
      - "${TOOL_GATEWAY_DNS:-1.1.1.1}"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GATEWAY_ROLE: assistant
      GATEWAY_PORT: 18765
      GATEWAY_TOKEN_ENV: TOOL_GATEWAY_TOKEN_ASSISTANT
      TOOL_GATEWAY_TOKEN_ASSISTANT: ${TOOL_GATEWAY_TOKEN_ASSISTANT}
      GATEWAY_HOST: ${GATEWAY_HOST:-127.0.0.1}
      GATEWAY_MAX_REQUEST_BODY_BYTES: ${GATEWAY_MAX_REQUEST_BODY_BYTES:-2097152}
      TOOL_RESULT_MAX_ROWS: ${TOOL_RESULT_MAX_ROWS:-10000}
      TOOL_EXPORT_MAX_ROWS: ${TOOL_EXPORT_MAX_ROWS:-250000}
      TOOL_EXPORT_MAX_BYTES: ${TOOL_EXPORT_MAX_BYTES:-262144000}
      SOURCE_CREDENTIALS_FILE: /run/secrets/assistant-sources.yaml
      CODE_DATA_DIR: /app/data/code
      CODE_CONFIG_FILE: /app/config/repositories.yaml
      AUDIT_LOG_DIR: /app/data/audit
      BIGQUERY_MAX_BYTES_BILLED: ${BIGQUERY_MAX_BYTES_BILLED:-1073741824}
      METABASE_URL: ${METABASE_URL:-https://metabase.example.invalid}
      SUPERFAKTURA_API_URL: ${SUPERFAKTURA_API_URL:-https://moja.superfaktura.sk}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/google-service-account.json}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-example-analytics-project}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v23.0}
    volumes:
      - ../../../config/agents:/app/config/agents:ro
      - ../../../config/repositories.yaml:/app/config/repositories.yaml:ro
      - ../../../data/agents:/app/data/agents
      - ../../../data/code:/app/data/code:ro
      - ../../../data/audit:/app/data/audit
      - ../../../data/runtime-secrets/assistant-sources.yaml:/run/secrets/assistant-sources.yaml:ro
      - ../../../data/runtime-secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
    depends_on:
      - code-sync

  code-sync:
    build:
      context: ../../../service/code-sync
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CODE_SYNC_CONFIG: /app/config/repositories.yaml
      CODE_SYNC_DATA: /app/data/code
      CODE_SYNC_INTERVAL_SECONDS: ${CODE_SYNC_INTERVAL_SECONDS:-300}
      GITHUB_TOKEN_FILE: /run/secrets/github-read-token
    volumes:
      - ../../../config/repositories.yaml:/app/config/repositories.yaml:ro
      - ../../../data/code:/app/data/code
      - ../../../data/runtime-secrets/github-read-token:/run/secrets/github-read-token:ro

  frontend:
    build:
      context: ../../../service/frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18080:80"

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
